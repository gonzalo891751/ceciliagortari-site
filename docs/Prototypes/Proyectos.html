<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Legislativo - Proyectos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#1C5CFF',
                            magenta: '#9F57A7',
                            cyan: '#24BCDE',
                            orange: '#FBA85F',
                            pink: '#E4BFE8',
                            dark: '#4E4E54',
                            gray: '#F3F4F6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #F9FAFB; color: #4E4E54; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #D1D5DB; }
        
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
        
        /* Badges */
        .badge-pendiente { background-color: #F3F4F6; color: #4E4E54; border: 1px solid #E5E7EB; }
        .badge-trabajo { background-color: #E0F7FA; color: #00838F; border: 1px solid #B2EBF2; } /* Cyan subtle */
        .badge-atrasado { background-color: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; } /* Orange subtle */
        .badge-presentado { background-color: #FCE4EC; color: #880E4F; border: 1px solid #F8BBD0; } /* Magenta subtle */
    </style>
</head>
<body class="flex h-screen overflow-hidden text-brand-dark">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col hidden md:flex z-10 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-blue to-brand-magenta flex items-center justify-center text-white font-bold text-lg shadow-md">
                CG
            </div>
            <div class="ml-3 flex flex-col">
                <span class="font-bold text-gray-800 leading-tight">Cecilia Gortari</span>
                <span class="text-xs text-gray-500 font-medium">Gestión Legislativa</span>
            </div>
        </div>
        
        <nav class="flex-1 py-6 px-4 space-y-1 overflow-y-auto custom-scrollbar">
            <a href="#" class="flex items-center px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-brand-blue rounded-lg transition-colors group">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-brand-blue transition-colors"></i>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 bg-blue-50 text-brand-blue rounded-lg transition-colors group relative">
                <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-8 bg-brand-blue rounded-r-full"></div>
                <i data-lucide="folder-kanban" class="w-5 h-5 mr-3 text-brand-blue"></i>
                <span class="font-semibold">Proyectos</span>
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-brand-blue rounded-lg transition-colors group">
                <i data-lucide="calendar" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-brand-blue transition-colors"></i>
                <span class="font-medium">Agenda</span>
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-brand-blue rounded-lg transition-colors group">
                <i data-lucide="megaphone" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-brand-blue transition-colors"></i>
                <span class="font-medium">Gacetillas</span>
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-brand-blue rounded-lg transition-colors group">
                <i data-lucide="archive" class="w-5 h-5 mr-3 text-gray-400 group-hover:text-brand-blue transition-colors"></i>
                <span class="font-medium">Archivos</span>
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-100">
            <button class="flex items-center px-3 py-2 w-full text-gray-500 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                <span class="font-medium">Salir</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#F8F9FB]">
        <!-- Header -->
        <header class="h-20 bg-white border-b border-gray-100 px-8 flex items-center justify-between z-10 sticky top-0">
            <div class="flex items-center">
                <h1 class="text-2xl font-bold text-gray-800">Proyectos</h1>
                <span class="ml-4 px-2.5 py-1 text-xs font-semibold bg-gray-100 text-gray-600 rounded-md">Ciclo 2026</span>
            </div>
            <div class="flex items-center space-x-3">
                <button class="p-2 text-gray-400 hover:text-brand-blue hover:bg-blue-50 rounded-lg transition-colors" title="Actualizar">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
                <button class="hidden sm:flex items-center px-4 py-2 border border-gray-200 text-gray-600 font-medium rounded-lg hover:bg-gray-50 hover:border-gray-300 transition-colors">
                    <i data-lucide="download" class="w-4 h-4 mr-2"></i> Exportar
                </button>
                <button class="flex items-center px-4 py-2 bg-brand-blue text-white font-medium rounded-lg hover:bg-blue-700 shadow-sm shadow-blue-200 transition-all transform hover:-translate-y-0.5">
                    <i data-lucide="plus" class="w-4 h-4 mr-2"></i> Nuevo Proyecto
                </button>
            </div>
        </header>

        <!-- Scrollable Body -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-6 lg:p-8">
            
            <!-- Context/Metrics Row -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <!-- Card 1 -->
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] flex items-center">
                    <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-brand-blue mr-4">
                        <i data-lucide="briefcase" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-500 mb-0.5">En Gestión</p>
                        <h3 class="text-2xl font-bold text-gray-800">12</h3>
                    </div>
                </div>
                <!-- Card 2 -->
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] flex items-center">
                    <div class="w-12 h-12 rounded-full bg-orange-50 flex items-center justify-center text-brand-orange mr-4">
                        <i data-lucide="alert-circle" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-500 mb-0.5">Requieren Atención</p>
                        <h3 class="text-2xl font-bold text-gray-800">3</h3>
                    </div>
                </div>
                <!-- Card 3 -->
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] flex items-center">
                    <div class="w-12 h-12 rounded-full bg-cyan-50 flex items-center justify-center text-brand-cyan mr-4">
                        <i data-lucide="clock" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-500 mb-0.5">Pendientes</p>
                        <h3 class="text-2xl font-bold text-gray-800">5</h3>
                    </div>
                </div>
                <!-- Card 4 -->
                <div class="bg-white p-5 rounded-2xl border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] flex items-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent to-pink-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="w-12 h-12 rounded-full bg-pink-50 flex items-center justify-center text-brand-magenta mr-4 relative z-10">
                        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                    </div>
                    <div class="relative z-10">
                        <p class="text-sm font-medium text-gray-500 mb-0.5">Presentados</p>
                        <h3 class="text-2xl font-bold text-gray-800">28</h3>
                    </div>
                </div>
            </div>

            <!-- Toolbar (Tabs + View Toggles) -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 sticky top-0 bg-[#F8F9FB] z-10 py-2">
                
                <!-- Tabs -->
                <div class="flex p-1 bg-white border border-gray-200 rounded-xl inline-flex shadow-sm" id="tabs-container">
                    <button onclick="setTab('gestion')" id="tab-gestion" class="px-5 py-2 text-sm font-semibold rounded-lg bg-brand-blue text-white shadow-sm transition-all flex items-center">
                        <i data-lucide="activity" class="w-4 h-4 mr-2"></i> En Gestión <span class="ml-2 bg-white/20 px-1.5 py-0.5 rounded text-xs">8</span>
                    </button>
                    <button onclick="setTab('presentados')" id="tab-presentados" class="px-5 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-all flex items-center">
                        <i data-lucide="archive-restore" class="w-4 h-4 mr-2"></i> Presentados
                    </button>
                    <button onclick="setTab('todos')" id="tab-todos" class="px-5 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-all">
                        Todos
                    </button>
                </div>

                <!-- Filters & Views -->
                <div class="flex items-center space-x-3">
                    <div class="relative hidden sm:block">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Buscar proyecto..." class="pl-9 pr-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue/20 focus:border-brand-blue w-64 bg-white">
                    </div>
                    <button class="p-2 border border-gray-200 bg-white rounded-xl text-gray-500 hover:text-brand-blue hover:bg-blue-50 transition-colors">
                        <i data-lucide="filter" class="w-5 h-5"></i>
                    </button>
                    
                    <div class="h-6 w-px bg-gray-300 mx-2"></div>
                    
                    <!-- View Toggles -->
                    <div class="flex bg-white border border-gray-200 rounded-xl p-0.5">
                        <button onclick="setView('list')" id="view-list" class="p-1.5 rounded-lg bg-gray-100 text-brand-blue shadow-sm" title="Vista Ejecutiva (Lista)">
                            <i data-lucide="list" class="w-4 h-4"></i>
                        </button>
                        <button onclick="setView('board')" id="view-board" class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600" title="Vista Tablero (Columnas)">
                            <i data-lucide="layout-grid" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Dynamic Content Area -->
            <div id="content-area" class="min-h-[400px]">
                <!-- Rendered by JS -->
            </div>

        </div>
    </main>

    <script>
        // Data Mockup
        const projects = [
            { id: 'EXP-045', title: 'Pedido de informe sobre retiro de programas nacionales', type: 'Resolución', topic: 'Desarrollo Social', state: 'en-trabajo', dateStr: 'Vence en 2 días', dateType: 'urgent', author: 'Equipo Principal' },
            { id: 'EXP-046', title: 'Alivio Corrientes: Reducción impositiva PyMEs', type: 'Ley', topic: 'Economía', state: 'en-trabajo', dateStr: 'Actualizado ayer', dateType: 'normal', author: 'Comisión Asesora' },
            { id: 'EXP-047', title: 'Señalización e iluminación RP 27 y RN 12', type: 'Declaración', topic: 'Infraestructura', state: 'atrasado', dateStr: 'Atrasado 5 días', dateType: 'alert', author: 'Equipo Principal' },
            { id: 'EXP-048', title: 'Limpieza y condiciones edilicias en escuelas rurales', type: 'Resolución', topic: 'Educación', state: 'pendiente', dateStr: 'Borrador iniciado', dateType: 'normal', author: 'Comisión Asesora' },
            { id: 'EXP-031', title: 'Adhesión a ley nacional de identidad de género', type: 'Ley', topic: 'Derechos Humanos', state: 'presentado', dateStr: 'Presentado 12 Mar 2026', dateType: 'success', author: 'Equipo Principal', ref: 'Exp. HCD-2026-112' },
            { id: 'EXP-028', title: 'Reglamento y garantía del acceso a la información pública', type: 'Ley', topic: 'Institucional', state: 'presentado', dateStr: 'En comisión', dateType: 'info', author: 'Equipo Principal', ref: 'Exp. HCD-2026-089' },
            { id: 'EXP-025', title: 'Declaración de Interés: Festival del Lapacho', type: 'Declaración', topic: 'Cultura', state: 'presentado', dateStr: 'Aprobado', dateType: 'success', author: 'Gestión Local', ref: 'Res. 04/2026' }
        ];

        let currentTab = 'gestion';
        let currentView = 'list';

        const stateConfig = {
            'pendiente': { label: 'Pendiente', classes: 'badge-pendiente', icon: 'clock' },
            'en-trabajo': { label: 'En Trabajo', classes: 'badge-trabajo', icon: 'edit-3' },
            'atrasado': { label: 'Atrasado', classes: 'badge-atrasado', icon: 'alert-triangle' },
            'presentado': { label: 'Presentado', classes: 'badge-presentado', icon: 'check-circle' }
        };

        const typeColors = {
            'Ley': 'bg-purple-100 text-purple-700',
            'Resolución': 'bg-blue-100 text-blue-700',
            'Declaración': 'bg-gray-100 text-gray-700'
        };

        const dateColors = {
            'urgent': 'text-brand-orange font-semibold',
            'alert': 'text-red-500 font-bold',
            'success': 'text-emerald-600 font-medium',
            'info': 'text-brand-blue font-medium',
            'normal': 'text-gray-500'
        };

        function setTab(tab) {
            currentTab = tab;
            // Update Tab UI
            ['gestion', 'presentados', 'todos'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if(t === tab) {
                    el.className = 'px-5 py-2 text-sm font-semibold rounded-lg bg-brand-blue text-white shadow-sm transition-all flex items-center';
                } else {
                    el.className = 'px-5 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-all flex items-center';
                }
            });
            render();
        }

        function setView(view) {
            currentView = view;
            // Update View Toggle UI
            if(view === 'list') {
                document.getElementById('view-list').className = 'p-1.5 rounded-lg bg-gray-100 text-brand-blue shadow-sm';
                document.getElementById('view-board').className = 'p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-50';
            } else {
                document.getElementById('view-board').className = 'p-1.5 rounded-lg bg-gray-100 text-brand-blue shadow-sm';
                document.getElementById('view-list').className = 'p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-50';
            }
            render();
        }

        function filterProjects() {
            if(currentTab === 'gestion') return projects.filter(p => p.state !== 'presentado');
            if(currentTab === 'presentados') return projects.filter(p => p.state === 'presentado');
            return projects;
        }

        function render() {
            const container = document.getElementById('content-area');
            const data = filterProjects();
            let html = '';

            if (currentView === 'list') {
                html = renderListView(data);
            } else {
                html = renderBoardView(data);
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        // VARIANTE 1: VISTA EJECUTIVA (Lista Mejorada)
        function renderListView(data) {
            if(data.length === 0) return `<div class="text-center py-12 text-gray-400">No hay proyectos en esta vista.</div>`;
            
            let listHtml = `<div class="space-y-3">`;
            data.forEach(p => {
                const state = stateConfig[p.state];
                const typeClass = typeColors[p.type] || 'bg-gray-100 text-gray-600';
                const dateClass = dateColors[p.dateType] || 'text-gray-500';
                
                // Jerarquía visual diferenciada: Si es "presentado", muestro ref de expediente. Si es "activo", muestro advertencia/días.
                const extraInfo = p.state === 'presentado' 
                    ? `<div class="flex items-center text-xs text-gray-500 mt-2 bg-gray-50 inline-flex px-2 py-1 rounded border border-gray-100"><i data-lucide="file-text" class="w-3 h-3 mr-1"></i> ${p.ref}</div>`
                    : '';

                listHtml += `
                    <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition-shadow group flex flex-col sm:flex-row sm:items-center gap-4">
                        
                        <!-- Left: ID & Type -->
                        <div class="w-32 flex-shrink-0 flex flex-col items-start">
                            <span class="text-xs font-bold text-gray-400 mb-1">${p.id}</span>
                            <span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded ${typeClass}">${p.type}</span>
                        </div>

                        <!-- Center: Title & Topic -->
                        <div class="flex-1 min-w-0">
                            <h4 class="text-base font-bold text-gray-800 truncate group-hover:text-brand-blue transition-colors cursor-pointer" title="${p.title}">
                                ${p.title}
                            </h4>
                            <div class="flex items-center mt-1 space-x-3">
                                <span class="text-xs text-gray-500 flex items-center"><i data-lucide="tag" class="w-3 h-3 mr-1"></i> ${p.topic}</span>
                                <span class="text-xs text-gray-400">•</span>
                                <span class="text-xs text-gray-500">${p.author}</span>
                            </div>
                            ${extraInfo}
                        </div>

                        <!-- Right: Status, Dates, Actions -->
                        <div class="flex items-center justify-between sm:justify-end gap-6 sm:w-80 flex-shrink-0">
                            <div class="flex flex-col items-start sm:items-end min-w-[120px]">
                                <span class="px-2.5 py-1 text-xs font-semibold rounded-full flex items-center ${state.classes}">
                                    <i data-lucide="${state.icon}" class="w-3 h-3 mr-1.5"></i> ${state.label}
                                </span>
                                <span class="text-xs mt-1.5 flex items-center ${dateClass}">
                                    ${p.dateStr}
                                </span>
                            </div>
                            
                            <div class="flex items-center space-x-1 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="p-1.5 text-gray-400 hover:text-brand-blue hover:bg-blue-50 rounded-md" title="Editar">
                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                </button>
                                <button class="p-1.5 text-gray-400 hover:text-brand-magenta hover:bg-pink-50 rounded-md" title="Mover a Presentado">
                                    <i data-lucide="arrow-right-circle" class="w-4 h-4"></i>
                                </button>
                                <button class="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md">
                                    <i data-lucide="more-vertical" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            listHtml += `</div>`;
            return listHtml;
        }

        // VARIANTE 2: VISTA TABLERO (Bloques Diferenciados / Kanban style)
        function renderBoardView(data) {
            // Group data by status for the board
            const columns = {
                'activos': data.filter(p => p.state !== 'presentado'),
                'presentados': data.filter(p => p.state === 'presentado')
            };

            // If we are in a specific tab, maybe we just show a grid. 
            // For true kanban comparison, we show columns if "Todos", or a grid if filtered.
            if(currentTab !== 'todos') {
                return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${data.map(p => renderCard(p)).join('')}</div>`;
            }

            // "Todos" view with clear separation (The requested Variant 2)
            return `
                <div class="flex flex-col lg:flex-row gap-6 items-start">
                    
                    <!-- Columna: Activos / En Gestión -->
                    <div class="flex-1 w-full bg-gray-50 rounded-2xl p-4 border border-gray-200">
                        <div class="flex items-center justify-between mb-4 px-2">
                            <h3 class="font-bold text-gray-700 flex items-center">
                                <div class="w-2 h-2 rounded-full bg-brand-cyan mr-2"></div>
                                En Gestión Operativa
                            </h3>
                            <span class="text-xs font-bold bg-white px-2 py-1 rounded-md text-gray-500 border border-gray-200">${columns.activos.length}</span>
                        </div>
                        <div class="space-y-3">
                            ${columns.activos.map(p => renderCard(p)).join('') || '<p class="text-sm text-gray-400 p-2">No hay proyectos activos.</p>'}
                        </div>
                    </div>

                    <!-- Columna: Presentados / Historial -->
                    <div class="flex-1 w-full bg-[#fcf8fd] rounded-2xl p-4 border border-[#F8BBD0]">
                        <div class="flex items-center justify-between mb-4 px-2">
                            <h3 class="font-bold text-brand-magenta flex items-center">
                                <div class="w-2 h-2 rounded-full bg-brand-magenta mr-2"></div>
                                Presentados / Historial
                            </h3>
                            <span class="text-xs font-bold bg-white px-2 py-1 rounded-md text-brand-magenta border border-pink-200">${columns.presentados.length}</span>
                        </div>
                        <div class="space-y-3 opacity-90 hover:opacity-100 transition-opacity">
                            ${columns.presentados.map(p => renderCard(p)).join('') || '<p class="text-sm text-gray-400 p-2">No hay proyectos presentados.</p>'}
                        </div>
                    </div>

                </div>
            `;
        }

        function renderCard(p) {
            const state = stateConfig[p.state];
            const typeClass = typeColors[p.type] || 'bg-gray-100 text-gray-600';
            const dateClass = dateColors[p.dateType] || 'text-gray-500';
            
            return `
                <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition-all cursor-pointer group">
                    <div class="flex justify-between items-start mb-3">
                        <span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded ${typeClass}">${p.type}</span>
                        <span class="px-2 py-0.5 text-[10px] font-semibold rounded-full flex items-center ${state.classes}">
                            ${state.label}
                        </span>
                    </div>
                    <h4 class="text-sm font-bold text-gray-800 mb-2 leading-tight group-hover:text-brand-blue transition-colors">
                        ${p.title}
                    </h4>
                    <p class="text-xs text-gray-500 mb-4 line-clamp-1"><i data-lucide="tag" class="w-3 h-3 inline mr-1"></i>${p.topic}</p>
                    
                    <div class="flex items-center justify-between pt-3 border-t border-gray-50">
                        <span class="text-xs font-medium flex items-center ${dateClass}">
                            <i data-lucide="calendar" class="w-3 h-3 mr-1"></i> ${p.dateStr}
                        </span>
                        <span class="text-[10px] font-bold text-gray-400">${p.id}</span>
                    </div>
                </div>
            `;
        }

        // Initialize
        render();
    </script>
</body>
